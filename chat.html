<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雑談ルーム - フリーツール集</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .chat-wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; height: calc(100vh - 160px); min-height: 420px; }
    .profile-bar { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 0.7rem 1rem; margin-bottom: 0.6rem; display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; }
    .profile-bar .icon, .msg .avatar {
      width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      background: #0f172a; border-radius: 50%; overflow: hidden; flex-shrink: 0;
    }
    .profile-bar .icon img, .msg .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .profile-bar .icon .emoji, .msg .avatar .emoji { font-size: 1.5rem; line-height: 1; }
    .msg .avatar { width: 34px; height: 34px; }
    .msg .avatar .emoji { font-size: 1.25rem; }
    .profile-bar input { flex: 1; min-width: 90px; border: 1px solid var(--border); border-radius: 6px; padding: 0.35rem 0.55rem; font-size: 0.95rem; }
    .icon-pick { display: flex; gap: 0.3rem; flex-wrap: wrap; align-items: center; }
    .icon-pick span, .icon-pick .pick-img {
      width: 32px; height: 32px; cursor: pointer; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid transparent; overflow: hidden; background: #0f172a;
    }
    .icon-pick span { font-size: 1.2rem; background: #f1f5f9; }
    .icon-pick .pick-img img { width: 100%; height: 100%; object-fit: cover; }
    .icon-pick span:hover, .icon-pick .pick-img:hover,
    .icon-pick span.active, .icon-pick .pick-img.active { border-color: #3b82f6; }
    .icon-upload-btn {
      width: 32px; height: 32px; border-radius: 50%; border: 2px dashed #94a3b8;
      background: #f8fafc; cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; color: #64748b; flex-shrink: 0;
    }
    .icon-upload-btn:hover { border-color: #3b82f6; color: #3b82f6; }
    #iconFile { display: none; }
    .messages { flex: 1; overflow-y: auto; background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 0.7rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .msg { display: flex; gap: 0.45rem; align-items: flex-start; animation: fadeIn 0.2s; position: relative; }
    .msg .body { background: #f1f5f9; border-radius: 10px; padding: 0.4rem 0.7rem; max-width: 78%; }
    .msg .name { font-size: 0.72rem; color: #64748b; margin-bottom: 0.1rem; }
    .msg .name .badge { background: #fef3c7; color: #92400e; font-size: 0.65rem; padding: 0 0.3rem; border-radius: 4px; margin-left: 0.25rem; }
    .msg .text { font-size: 0.93rem; word-break: break-word; }
    .msg .time { font-size: 0.65rem; color: #94a3b8; margin-top: 0.15rem; }
    .msg.mine { flex-direction: row-reverse; }
    .msg.mine .body { background: #dbeafe; }
    .msg.system { justify-content: center; }
    .msg.system .body { background: transparent; color: #94a3b8; font-size: 0.78rem; }
    .msg.deleted .text { color: #94a3b8; font-style: italic; }
    .typing { font-size: 0.78rem; color: #94a3b8; min-height: 1.15rem; padding: 0.15rem 0.4rem; }
    .input-bar { display: flex; gap: 0.45rem; margin-top: 0.5rem; }
    .input-bar input { flex: 1; border: 1px solid var(--border); border-radius: 8px; padding: 0.55rem 0.75rem; font-size: 0.95rem; }
    .input-bar button { flex-shrink: 0; }
    .notice { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 8px; padding: 0.5rem 0.8rem; font-size: 0.78rem; color: #9a3412; margin-bottom: 0.6rem; }
    .timeout-banner { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; border-radius: 8px; padding: 0.5rem 0.8rem; font-size: 0.85rem; margin-bottom: 0.5rem; display: none; }
    .admin-link { font-size: 0.75rem; color: #64748b; text-align: right; margin-bottom: 0.3rem; }
    .admin-link a { color: #64748b; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <header>
    <div class="page-header" style="justify-content:center; flex-direction:column; gap:0.25rem;">
      <a href="index.html" class="back-link">← トップに戻る</a>
      <h1>雑談ルーム</h1>
    </div>
  </header>

  <main>
    <div class="chat-wrap">
      <div class="admin-link"><a href="admin.html">管理</a></div>
      <div class="notice">
        同じブラウザの複数タブで共有されます。禁止ワード・荒らし対策あり。
      </div>
      <div class="timeout-banner" id="timeoutBanner"></div>

      <div class="profile-bar" id="profileBar">
        <div class="icon" id="myIcon"></div>
        <input type="text" id="nickname" placeholder="ニックネーム" maxlength="16" value="名無しさん">
        <div class="icon-pick" id="iconPick">
          <div class="pick-img" data-icon="img:default" title="デフォルト"><img src="img/default-avatar.png" alt=""></div>
          <span data-icon="🐱">🐱</span>
          <span data-icon="🐶">🐶</span>
          <span data-icon="🐼">🐼</span>
          <span data-icon="🦊">🦊</span>
          <span data-icon="🐧">🐧</span>
          <span data-icon="🦄">🦄</span>
          <span data-icon="🐸">🐸</span>
          <span data-icon="🎃">🎃</span>
          <span data-icon="⭐">⭐</span>
          <span data-icon="🔥">🔥</span>
          <label class="icon-upload-btn" title="画像をアップロード" for="iconFile">＋</label>
          <input type="file" id="iconFile" accept="image/*">
        </div>
      </div>

      <div class="messages" id="messages"></div>
      <div class="typing" id="typing"></div>

      <div class="input-bar">
        <input type="text" id="input" placeholder="メッセージを入力…" maxlength="200" autocomplete="off">
        <button class="btn" id="send">送信</button>
      </div>
    </div>
  </main>

  <script>
    const CHANNEL = 'freetools_chat_v2';
    const PROFILE_KEY = 'freetools_chat_profile';
    const ADMIN_KEY = 'freetools_admin_session';
    const BLOCK_KEY = 'freetools_blocked_words';
    const TIMEOUT_KEY = 'freetools_timeouts';
    const DEFAULT_ICON = 'img:default';
    const DEFAULT_AVATAR_SRC = 'img/default-avatar.png';
    const DEFAULT_BLOCKED = ['死ね','しね','sine','kill yourself','kys','バカ','馬鹿','アホ','あほ','クソ','くそ','カス','かす','消えろ','くたばれ','殺す','ころす'];

    let myId = sessionStorage.getItem('chat_uid') || (Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
    sessionStorage.setItem('chat_uid', myId);

    function isAdmin() {
      try {
        const s = JSON.parse(sessionStorage.getItem(ADMIN_KEY) || 'null');
        return s && s.ok === true && s.uid === myId;
      } catch { return false; }
    }

    function getBlockedWords() {
      try {
        const w = JSON.parse(localStorage.getItem(BLOCK_KEY));
        if (Array.isArray(w) && w.length) return w.map(x => x.toLowerCase());
      } catch {}
      localStorage.setItem(BLOCK_KEY, JSON.stringify(DEFAULT_BLOCKED));
      return DEFAULT_BLOCKED.map(x => x.toLowerCase());
    }

    function containsBlocked(text) {
      const lower = (text || '').toLowerCase();
      return getBlockedWords().some(w => w && lower.includes(w));
    }

    function getTimeouts() {
      try { return JSON.parse(localStorage.getItem(TIMEOUT_KEY) || '{}'); } catch { return {}; }
    }
    function setTimeouts(obj) {
      localStorage.setItem(TIMEOUT_KEY, JSON.stringify(obj));
    }
    function getMyTimeoutUntil() {
      const t = getTimeouts()[myId];
      return t && t > Date.now() ? t : 0;
    }
    function isTimedOut() {
      return getMyTimeoutUntil() > Date.now();
    }
    function applyTimeout(uid, minutes) {
      const t = getTimeouts();
      t[uid] = Date.now() + minutes * 60 * 1000;
      setTimeouts(t);
    }

    // icon helpers: "img:default" or emoji string
    function isImgIcon(icon) {
      return typeof icon === 'string' && icon.indexOf('img:') === 0;
    }
    function isDataIcon(icon) {
      return typeof icon === 'string' && icon.indexOf('data:image/') === 0;
    }
    function renderIconHtml(icon) {
      if (isDataIcon(icon)) {
        return '<img src="' + icon + '" alt="">';
      }
      if (isImgIcon(icon) || !icon) {
        return '<img src="' + DEFAULT_AVATAR_SRC + '" alt="">';
      }
      return '<span class="emoji">' + icon + '</span>';
    }
    function setIconEl(el, icon) {
      el.innerHTML = renderIconHtml(icon);
    }

    let profile = JSON.parse(localStorage.getItem(PROFILE_KEY) || '{}');
    if (!profile.nick) profile.nick = '名無しさん';
    // migrate old default cat to image default
    if (!profile.icon || profile.icon === '🐱') profile.icon = DEFAULT_ICON;

    const nickEl = document.getElementById('nickname');
    const iconEl = document.getElementById('myIcon');
    const msgsEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const typingEl = document.getElementById('typing');
    const timeoutBanner = document.getElementById('timeoutBanner');
    const bc = ('BroadcastChannel' in window) ? new BroadcastChannel(CHANNEL) : null;

    function refreshAdminUI() {
      if (isAdmin()) {
        profile.nick = '[製作者]';
        nickEl.value = '[製作者]';
        nickEl.disabled = true;
        setIconEl(iconEl, profile.icon);
        document.getElementById('iconPick').style.display = 'none';
      } else {
        nickEl.disabled = false;
        nickEl.value = profile.nick === '[製作者]' ? '名無しさん' : profile.nick;
        if (profile.nick === '[製作者]') profile.nick = '名無しさん';
        setIconEl(iconEl, profile.icon);
        document.getElementById('iconPick').style.display = '';
      }
    }
    refreshAdminUI();

    function markActivePick() {
      document.querySelectorAll('#iconPick [data-icon]').forEach(function(s) {
        s.classList.toggle('active', s.getAttribute('data-icon') === profile.icon);
      });
    }
    markActivePick();

    document.querySelectorAll('#iconPick [data-icon]').forEach(function(s) {
      s.onclick = function() {
        if (isAdmin()) return;
        profile.icon = s.getAttribute('data-icon');
        setIconEl(iconEl, profile.icon);
        markActivePick();
        localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
      };
    });

    // 画像アップロード（リサイズして data URL で保存）
    document.getElementById('iconFile').onchange = function(e) {
      if (isAdmin()) return;
      var file = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!file) return;
      if (!file.type || file.type.indexOf('image/') !== 0) {
        alert('画像ファイルを選んでください');
        return;
      }
      if (file.size > 3 * 1024 * 1024) {
        alert('ファイルが大きすぎます（3MB以下にしてください）');
        return;
      }
      var reader = new FileReader();
      reader.onload = function() {
        var img = new Image();
        img.onload = function() {
          var size = 128;
          var canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          var ctx = canvas.getContext('2d');
          // cover crop
          var s = Math.min(img.width, img.height);
          var sx = (img.width - s) / 2;
          var sy = (img.height - s) / 2;
          ctx.drawImage(img, sx, sy, s, s, 0, 0, size, size);
          var dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          // localStorage 容量対策（おおよそ 100KB 超は拒否）
          if (dataUrl.length > 140000) {
            alert('画像をさらに小さくしてください');
            return;
          }
          profile.icon = dataUrl;
          setIconEl(iconEl, profile.icon);
          markActivePick();
          localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
        };
        img.onerror = function() { alert('画像の読み込みに失敗しました'); };
        img.src = reader.result;
      };
      reader.onerror = function() { alert('ファイルの読み込みに失敗しました'); };
      reader.readAsDataURL(file);
    };

    nickEl.onchange = nickEl.onblur = function() {
      if (isAdmin()) return;
      var n = nickEl.value.trim() || '名無しさん';
      if (containsBlocked(n) || n.indexOf('[製作者]') !== -1) {
        alert('そのニックネームは使用できません');
        nickEl.value = profile.nick;
        return;
      }
      profile.nick = n;
      nickEl.value = n;
      localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
    };

    function updateTimeoutBanner() {
      var until = getMyTimeoutUntil();
      if (until > Date.now()) {
        var left = Math.ceil((until - Date.now()) / 60000);
        timeoutBanner.style.display = 'block';
        timeoutBanner.textContent = 'タイムアウト中です。あと約' + left + '分お待ちください。';
        inputEl.disabled = true;
        document.getElementById('send').disabled = true;
      } else {
        timeoutBanner.style.display = 'none';
        inputEl.disabled = false;
        document.getElementById('send').disabled = false;
      }
    }
    updateTimeoutBanner();
    setInterval(updateTimeoutBanner, 10000);

    var history = JSON.parse(sessionStorage.getItem('chat_history_v2') || '[]');

    function appendMsg(m, animate) {
      if (animate === undefined) animate = true;
      var div = document.createElement('div');
      if (m.type === 'system') {
        div.className = 'msg system';
        div.innerHTML = '<div class="body">' + esc(m.text) + '</div>';
      } else {
        var mine = m.id === myId;
        var deleted = !!m.deleted;
        div.className = 'msg' + (mine ? ' mine' : '') + (deleted ? ' deleted' : '');
        var badge = (m.nick === '[製作者]') ? '<span class="badge">製作者</span>' : '';
        var timeStr = m.t ? new Date(m.t).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }) : '';
        div.innerHTML =
          '<div class="avatar">' + renderIconHtml(m.icon) + '</div>' +
          '<div class="body">' +
            '<div class="name">' + esc(m.nick || '?') + badge + '</div>' +
            '<div class="text">' + (deleted ? '（削除されたメッセージ）' : esc(m.text)) + '</div>' +
            (timeStr ? '<div class="time">' + timeStr + '</div>' : '') +
          '</div>';
      }
      if (!animate) div.style.animation = 'none';
      msgsEl.appendChild(div);
    }

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function scrollBottom() {
      msgsEl.scrollTop = msgsEl.scrollHeight;
    }

    history.forEach(function(m) { appendMsg(m, false); });
    scrollBottom();

    function saveHistory() {
      if (history.length > 150) history = history.slice(-150);
      sessionStorage.setItem('chat_history_v2', JSON.stringify(history));
    }

    function send(text) {
      if (isTimedOut()) {
        alert('タイムアウト中です');
        return;
      }
      text = (text || '').trim();
      if (!text) return;

      if (!isAdmin() && containsBlocked(profile.nick)) {
        alert('ニックネームに禁止ワードが含まれています。変更してください。');
        return;
      }

      if (containsBlocked(text)) {
        applyTimeout(myId, 10);
        updateTimeoutBanner();
        var sys = { type: 'system', text: profile.nick + ' のメッセージが禁止ワードにより削除され、10分のタイムアウトが適用されました', t: Date.now() };
        history.push(sys);
        appendMsg(sys);
        saveHistory();
        if (bc) {
          bc.postMessage(sys);
          bc.postMessage({ type: 'timeout', id: myId, minutes: 10, until: getTimeouts()[myId] });
        }
        alert('禁止ワードが含まれていたためメッセージは送信されず、10分間タイムアウトになりました。');
        return;
      }

      var msg = {
        type: 'chat',
        id: myId,
        nick: isAdmin() ? '[製作者]' : profile.nick,
        icon: profile.icon,
        text: text,
        t: Date.now()
      };
      history.push(msg);
      saveHistory();
      appendMsg(msg);
      scrollBottom();
      if (bc) {
        bc.postMessage(msg);
        bc.postMessage({ type: 'typing', id: myId, nick: msg.nick, typing: false });
      }
    }

    document.getElementById('send').onclick = function() {
      send(inputEl.value);
      inputEl.value = '';
    };
    inputEl.onkeydown = function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send(inputEl.value);
        inputEl.value = '';
      }
    };

    var typingTimer = null;
    var othersTyping = new Map();
    inputEl.oninput = function() {
      if (isTimedOut()) return;
      if (bc) bc.postMessage({ type: 'typing', id: myId, nick: isAdmin() ? '[製作者]' : profile.nick, typing: true });
      clearTimeout(typingTimer);
      typingTimer = setTimeout(function() {
        if (bc) bc.postMessage({ type: 'typing', id: myId, nick: profile.nick, typing: false });
      }, 1500);
    };
    function updateTyping() {
      var names = Array.from(othersTyping.values());
      if (!names.length) typingEl.textContent = '';
      else if (names.length === 1) typingEl.textContent = names[0] + ' が入力中…';
      else typingEl.textContent = names.join('、') + ' が入力中…';
    }

    if (bc) {
      bc.onmessage = function(e) {
        var m = e.data;
        if (!m) return;
        if (m.id === myId && m.type !== 'mod_delete' && m.type !== 'mod_timeout') return;

        if (m.type === 'chat') {
          history.push(m);
          saveHistory();
          appendMsg(m);
          scrollBottom();
          othersTyping.delete(m.id);
          updateTyping();
        } else if (m.type === 'system') {
          history.push(m);
          saveHistory();
          appendMsg(m);
          scrollBottom();
        } else if (m.type === 'typing') {
          if (m.id === myId) return;
          if (m.typing) othersTyping.set(m.id, m.nick);
          else othersTyping.delete(m.id);
          updateTyping();
        } else if (m.type === 'join') {
          if (m.id === myId) return;
          appendMsg({ type: 'system', text: (m.nick || '誰か') + ' が入室しました' });
          scrollBottom();
        } else if (m.type === 'timeout') {
          var t = getTimeouts();
          t[m.id] = m.until;
          setTimeouts(t);
          if (m.id === myId) updateTimeoutBanner();
        } else if (m.type === 'mod_delete') {
          history.forEach(function(h) {
            if (h.t === m.targetT && h.id === m.targetId) h.deleted = true;
          });
          saveHistory();
          msgsEl.innerHTML = '';
          history.forEach(function(h) { appendMsg(h, false); });
          scrollBottom();
        } else if (m.type === 'mod_clear') {
          history = [];
          saveHistory();
          msgsEl.innerHTML = '';
          appendMsg({ type: 'system', text: '管理者がチャットをクリアしました' });
        } else if (m.type === 'mod_blockwords') {
          localStorage.setItem(BLOCK_KEY, JSON.stringify(m.words || []));
        }
      };
      bc.postMessage({ type: 'join', id: myId, nick: isAdmin() ? '[製作者]' : profile.nick });
    }

    if (history.length === 0) {
      appendMsg({ type: 'system', text: 'ルームに入りました。禁止ワードに注意して雑談を楽しんでください。' });
    }

    window.addEventListener('storage', function(e) {
      if (e.key === TIMEOUT_KEY) updateTimeoutBanner();
      if (e.key === ADMIN_KEY) refreshAdminUI();
    });
  </script>
</body>
</html>
