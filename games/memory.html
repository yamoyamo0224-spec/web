<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>神経衰弱 - フリーツール集</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    #board{display:grid;grid-template-columns:repeat(4,70px);gap:8px;justify-content:center;margin:1rem auto;}
    .card{width:70px;height:70px;background:#3b82f6;border-radius:8px;display:flex;align-items:center;justify-content:center;
      font-size:1.8rem;cursor:pointer;transition:transform 0.2s;user-select:none;}
    .card.flipped,.card.matched{background:#fff;border:2px solid #cbd5e1;}
    .card.matched{opacity:0.6;cursor:default;}
    .info{text-align:center;margin:0.5rem 0;}
  </style>
</head>
<body>
  <header>
    <div class="page-header" style="justify-content:center;flex-direction:column;gap:0.3rem;">
      <a href="../games.html" class="back-link">← ゲーム一覧</a>
      <h1>神経衰弱</h1>
    </div>
  </header>
  <main>
    <div class="info">手数: <span id="moves">0</span>　残り: <span id="left">8</span></div>
    <div id="board"></div>
    <div style="text-align:center;margin-top:1rem;"><button class="btn" id="reset">リセット</button></div>
  </main>
  <script>
    const EMOJIS=['🍎','🍌','🍇','🍊','🍓','🍉','🥝','🍑'];
    let cards,flipped,matched,moves,lock;

    function init(){
      const pairs=[...EMOJIS,...EMOJIS].sort(()=>Math.random()-0.5);
      cards=pairs.map((e,i)=>({id:i,emoji:e,flipped:false,matched:false}));
      flipped=[]; matched=0; moves=0; lock=false;
      document.getElementById('moves').textContent=0;
      document.getElementById('left').textContent=8;
      render();
    }

    function render(){
      const board=document.getElementById('board');
      board.innerHTML='';
      cards.forEach((c,i)=>{
        const d=document.createElement('div');
        d.className='card'+(c.flipped||c.matched?' flipped':'')+(c.matched?' matched':'');
        d.textContent=(c.flipped||c.matched)?c.emoji:'';
        d.onclick=()=>flip(i);
        board.appendChild(d);
      });
    }

    function flip(i){
      if(lock||cards[i].flipped||cards[i].matched) return;
      cards[i].flipped=true; flipped.push(i); render();
      if(flipped.length===2){
        moves++; document.getElementById('moves').textContent=moves;
        lock=true;
        const [a,b]=flipped;
        if(cards[a].emoji===cards[b].emoji){
          cards[a].matched=cards[b].matched=true; matched++;
          document.getElementById('left').textContent=8-matched;
          flipped=[]; lock=false;
          if(matched===8) setTimeout(()=>alert('クリア！ 手数: '+moves),300);
        } else {
          setTimeout(()=>{ cards[a].flipped=cards[b].flipped=false; flipped=[]; lock=false; render(); },700);
        }
      }
    }

    document.getElementById('reset').onclick=init;
    init();
  </script>
<script src="../js/game-common.js"></script>
</body>
</html>
