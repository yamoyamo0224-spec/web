<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 - フリーツール集</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    #board2048 {
      display: grid;
      grid-template-columns: repeat(4, 70px);
      grid-template-rows: repeat(4, 70px);
      gap: 8px;
      background: #bbada0;
      padding: 8px;
      border-radius: 10px;
      margin: 0 auto;
      width: fit-content;
    }
    .tile {
      width: 70px;
      height: 70px;
      background: #cdc1b4;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 700;
      color: #776e65;
    }
    .tile-2 { background: #eee4da; }
    .tile-4 { background: #ede0c8; }
    .tile-8 { background: #f2b179; color: #f9f6f2; }
    .tile-16 { background: #f59563; color: #f9f6f2; }
    .tile-32 { background: #f67c5f; color: #f9f6f2; }
    .tile-64 { background: #f65e3b; color: #f9f6f2; }
    .tile-128 { background: #edcf72; color: #f9f6f2; font-size: 1.4rem; }
    .tile-256 { background: #edcc61; color: #f9f6f2; font-size: 1.4rem; }
    .tile-512 { background: #edc850; color: #f9f6f2; font-size: 1.4rem; }
    .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 1.2rem; }
    .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 1.2rem; }
    .info { text-align: center; margin: 1rem 0; }
  </style>
</head>
<body>
  <header>
    <div class="page-header" style="justify-content:center; flex-direction:column; gap:0.3rem;">
      <a href="../games.html" class="back-link">← ゲーム一覧</a>
      <h1>2048</h1>
    </div>
  </header>
  <main>
    <div class="info">スコア: <strong id="score">0</strong></div>
    <div id="board2048"></div>
    <div style="text-align:center; margin-top:1.2rem;">
      <button class="btn" id="newgame">新しいゲーム</button>
      <p style="margin-top:0.8rem; color:#666; font-size:0.85rem;">矢印キーで操作</p>
    </div>
  </main>
  <script>
    let grid, score;
    const boardEl = document.getElementById('board2048');

    function init() {
      grid = Array(4).fill().map(() => Array(4).fill(0));
      score = 0;
      document.getElementById('score').textContent = 0;
      addTile();
      addTile();
      render();
    }

    function addTile() {
      const empty = [];
      for (let r=0;r<4;r++) for (let c=0;c<4;c++) if (!grid[r][c]) empty.push([r,c]);
      if (!empty.length) return;
      const [r,c] = empty[Math.floor(Math.random()*empty.length)];
      grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    }

    function render() {
      boardEl.innerHTML = '';
      for (let r=0;r<4;r++) for (let c=0;c<4;c++) {
        const d = document.createElement('div');
        d.className = 'tile' + (grid[r][c] ? ' tile-' + grid[r][c] : '');
        d.textContent = grid[r][c] || '';
        boardEl.appendChild(d);
      }
    }

    function slide(row) {
      let arr = row.filter(x => x);
      for (let i=0;i<arr.length-1;i++) {
        if (arr[i] === arr[i+1]) {
          arr[i] *= 2;
          score += arr[i];
          arr[i+1] = 0;
        }
      }
      arr = arr.filter(x => x);
      while (arr.length < 4) arr.push(0);
      return arr;
    }

    function move(dir) {
      let moved = false;
      const old = JSON.stringify(grid);
      if (dir === 'left') {
        for (let r=0;r<4;r++) grid[r] = slide(grid[r]);
      } else if (dir === 'right') {
        for (let r=0;r<4;r++) grid[r] = slide(grid[r].reverse()).reverse();
      } else if (dir === 'up') {
        for (let c=0;c<4;c++) {
          let col = [grid[0][c],grid[1][c],grid[2][c],grid[3][c]];
          col = slide(col);
          for (let r=0;r<4;r++) grid[r][c] = col[r];
        }
      } else if (dir === 'down') {
        for (let c=0;c<4;c++) {
          let col = [grid[0][c],grid[1][c],grid[2][c],grid[3][c]].reverse();
          col = slide(col).reverse();
          for (let r=0;r<4;r++) grid[r][c] = col[r];
        }
      }
      if (JSON.stringify(grid) !== old) {
        addTile();
        document.getElementById('score').textContent = score;
        render();
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') move('left');
      if (e.key === 'ArrowRight') move('right');
      if (e.key === 'ArrowUp') move('up');
      if (e.key === 'ArrowDown') move('down');
    });

    document.getElementById('newgame').onclick = init;
    init();
  </script>
<script src="../js/game-common.js"></script>
</body>
</html>
