<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スネーク - フリーツール集</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    canvas { background: #1a1a2e; border-radius: 8px; display: block; margin: 0 auto; max-width: 100%; }
    .controls { text-align: center; margin-top: 1rem; }
    .score-display { text-align: center; font-size: 1.2rem; margin: 0.5rem 0; }
  </style>
</head>
<body>
  <header>
    <div class="page-header" style="justify-content:center; flex-direction:column; gap:0.3rem;">
      <a href="../games.html" class="back-link">← ゲーム一覧</a>
      <h1>スネーク</h1>
    </div>
  </header>
  <main>
    <div class="score-display">スコア: <span id="score">0</span></div>
    <canvas id="c" width="400" height="400"></canvas>
    <div class="controls">
      <button class="btn" id="restart">リスタート</button>
      <p style="margin-top:0.8rem; color:#666; font-size:0.85rem;">矢印キー または 画面スワイプで操作</p>
    </div>
  </main>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const grid = 20;
    let snake, dir, food, score, gameOver, interval;

    function init() {
      snake = [{x:10,y:10}];
      dir = {x:1,y:0};
      food = placeFood();
      score = 0;
      gameOver = false;
      document.getElementById('score').textContent = score;
      clearInterval(interval);
      interval = setInterval(update, 120);
    }

    function placeFood() {
      let p;
      do {
        p = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)};
      } while (snake.some(s => s.x===p.x && s.y===p.y));
      return p;
    }

    function update() {
      if (gameOver) return;
      const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
      if (head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20 ||
          snake.some(s => s.x===head.x && s.y===head.y)) {
        gameOver = true;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0,0,400,400);
        ctx.fillStyle = '#fff';
        ctx.font = '28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('ゲームオーバー', 200, 190);
        ctx.font = '18px sans-serif';
        ctx.fillText('スコア: ' + score, 200, 220);
        return;
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').textContent = score;
        food = placeFood();
      } else {
        snake.pop();
      }
      draw();
    }

    function draw() {
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0,0,400,400);
      ctx.fillStyle = '#22c55e';
      snake.forEach((s,i) => {
        ctx.fillStyle = i===0 ? '#4ade80' : '#22c55e';
        ctx.fillRect(s.x*grid+1, s.y*grid+1, grid-2, grid-2);
      });
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(food.x*grid+10, food.y*grid+10, 8, 0, Math.PI*2);
      ctx.fill();
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp' && dir.y===0) dir = {x:0,y:-1};
      if (e.key === 'ArrowDown' && dir.y===0) dir = {x:0,y:1};
      if (e.key === 'ArrowLeft' && dir.x===0) dir = {x:-1,y:0};
      if (e.key === 'ArrowRight' && dir.x===0) dir = {x:1,y:0};
    });

    // タッチ操作
    let touchStart = null;
    canvas.addEventListener('touchstart', e => {
      touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
    });
    canvas.addEventListener('touchend', e => {
      if (!touchStart) return;
      const dx = e.changedTouches[0].clientX - touchStart.x;
      const dy = e.changedTouches[0].clientY - touchStart.y;
      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 20 && dir.x===0) dir = {x:1,y:0};
        if (dx < -20 && dir.x===0) dir = {x:-1,y:0};
      } else {
        if (dy > 20 && dir.y===0) dir = {x:0,y:1};
        if (dy < -20 && dir.y===0) dir = {x:0,y:-1};
      }
      touchStart = null;
    });

    document.getElementById('restart').onclick = init;
    init();
  </script>
<script src="../js/game-common.js"></script>
</body>
</html>
